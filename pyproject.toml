[project]
name = "quant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "scikit-learn",
    "lightgbm",
    "statsmodels",
    "pyarrow",
    "pyyaml",
    "streamlit",
    "plotly",
    "exchange-calendars>=4.13.2",
    "arch>=8.0.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
